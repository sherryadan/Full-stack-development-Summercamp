<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <!-- tailwind CSS Import -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Custom Css -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="max-w-2xl mx-auto px-4 py-10">
        <!-- Header -->
        <div class="text-center mb-8">
        <h1 class="text-4xl font-bold text-gray-800" >Task Manager</h1>
        <p class="text-gray-400 mt-2">Manage your daily tasks with ease</p>
        </div>

    <!-- Task Input -->
     <div class="bg-white p-6 rounded-xl shadow-md mb-6">
        <div class="flex gap-7">
            <input 
            id="taskInput"  
            type="text" 
            placeholder="Enter a New Task"
            class="flex-1 border border-gray-400 rounded-lg px-4 py-3 focus: outline-none focus: ring-2 focus: ring-purple-700"
            >
            <button
            id="addTaskbtn"
            class="bg-purple-600 hover:bg-purple-800 text-white px-5 py-2 rounded-xl font-semibold"
            > Add </button>
        </div>
     </div>
     <!-- Task Stats -->
      <div class="grid grid-cols-2 gap-4 mb-5">
        <div class="bg-white rounded-xl p-5 shadow text-center">
            <h2 class="text-gray-500"> Total Tasks</h2>
            <p id="totalTasks" class="text-3xl font-bold text-purple-500 mt-2">
                0
            </p>
        </div>
        <div class="bg-white rounded-xl p-5 shadow text-center">
            <h2 class="text-gry-500">
                Completed Tasks
            </h2>
            <p id="completedTasks" class="text-3xl font-bold text-purple-500 mt-2">0</p>
        </div>
      </div>
      <!-- Task List -->
       <div class="bg-white rounded-xl shadow-md p-6">
        <h2 class="text-xl font-bold text-gray-700 mb-4"> My Tasks</h2>
        <div id="taskList">
            <!-- Javascript will add tasks -->
             <p id="emptyMessage"
             class="text-center text-gray-400 py-6">
                No Tasks yet, add your first one
             </p>
        </div>
       </div>
    </div>

     
</body>
</html>
